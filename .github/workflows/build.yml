name: Build Arch ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso

      - name: Build ISO
        run: |
          mkarchiso -v .

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: iso
          path: out/*