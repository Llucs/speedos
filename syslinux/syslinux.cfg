UI menu.c32
PROMPT 0
MENU TITLE SpeedOS
TIMEOUT 50

LABEL speedos
    MENU LABEL Start SpeedOS
    LINUX /vmlinuz-linux-lqx
    INITRD /initramfs-linux-lqx.img
    APPEND archisobasedir=speedos archisolabel=SPEEDOS cow_spacesize=2G quiet

LABEL speedos_nomodeset
    MENU LABEL Start SpeedOS (Safe Mode)
    LINUX /vmlinuz-linux-lqx
    INITRD /initramfs-linux-lqx.img
    APPEND archisobasedir=speedos archisolabel=SPEEDOS nomodeset

LABEL memtest
    MENU LABEL Run Memtest
    LINUX /boot/memtest86+/memtest.bin